name: Update validation and quality briefing

on:
  schedule:
    - cron: "17 14 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quality-blog-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check official sources
        run: python scripts/update_blog.py
      - name: Publish new source-linked entries
        shell: bash
        run: |
          if git diff --quiet -- blog/data/entries.json blog/feed.xml; then
            echo "No new relevant updates."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/data/entries.json blog/feed.xml
          git commit -m "Update validation and quality briefing"
          git push
